<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo Overview</title>
<style>
  :root {
    /* Wise-inspired palette. Bright green is a FILL, never text on white
       (too light to read). Forest green is the ink + the "brand" text color. */
    --bg: #f5f7f4;
    --panel: #ffffff;
    --ink: #163300;            /* forest green — headings & body text */
    --ink-soft: #5a6b52;       /* muted green-grey */
    --ink-faint: #93a08b;
    --line: #e8ebe4;
    --line-strong: #d7ddd0;
    --accent: #9fe870;         /* Wise bright green — fills only */
    --accent-hover: #8edb5c;
    --accent-ink: #163300;     /* text/icon color that reads as "brand" */
    --accent-soft: #eafada;    /* pale green tint for active/selected states */
    --forest: #163300;
    --green: #2f6b1e;          /* readable positive-green text */
    --amber: #8a6a00;
    --red: #b3261e;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(22,51,0,.05), 0 10px 30px rgba(22,51,0,.07);
    --ring: 0 0 0 3px rgba(159,232,112,.55);   /* soft green focus glow */
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* Mode is signalled by the toggle + a subtle background temperature shift —
     the Wise green accent stays constant across Work and Private. */
  body[data-mode="work"]    { --bg: #f2f6f5; }   /* cool */
  body[data-mode="private"] { --bg: #f7f5f0; }   /* warm */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* 100dvh follows the *dynamic* viewport so mobile browser chrome (address/tab bars) can't
     crop the app; the 100vh line before it is the fallback for browsers without dvh. */
  .app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; height: 100dvh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow-y: auto;
    padding: 18px 12px 12px;
  }
  .brand { font-weight: 800; font-size: 16px; padding: 2px 8px 18px; letter-spacing: -.3px; color: var(--forest); }
  .brand span { color: var(--accent-ink); }

  .nav-group { margin-bottom: 18px; }
  .nav-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-faint); font-weight: 600; padding: 0 8px 6px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-label button {
    border: none; background: none; color: var(--ink-faint); font-size: 15px;
    line-height: 1; padding: 0 2px; border-radius: 4px;
  }
  .nav-label button:hover { color: var(--forest); background: var(--accent-soft); }

  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 8px; border-radius: 8px; color: var(--ink-soft);
    border: none; background: none; width: 100%; text-align: left; font-size: 13.5px;
  }
  .nav-item:hover { background: #eef1ec; }
  .nav-item.active { background: var(--accent-soft); color: var(--forest); font-weight: 600; }
  .nav-item .ico { width: 16px; text-align: center; font-size: 14px; flex: none; }
  .nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--ink-faint); font-weight: 500; }
  .nav-item.active .count { color: var(--forest); }
  .nav-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .last-changed { font-size: 11px; color: var(--ink-faint); padding: 8px 8px 0; }
  /* ⋮ per-row action menu (areas + projects), visible on both desktop and touch — replaces the
     old hover-only "⇄" move and the hidden right-click rename. Faint until hovered; enlarged and
     fully opaque on mobile (see the media query) so it's an obvious tap target. */
  .nav-item .row-menu {
    font-size: 16px; color: var(--ink-faint); padding: 0 6px; margin-left: 2px;
    border-radius: 6px; opacity: .55; line-height: 1; flex: none;
    transition: opacity .12s, color .12s, background .12s;
  }
  .nav-item:hover .row-menu { opacity: 1; }
  .nav-item .row-menu:hover { opacity: 1; color: var(--forest); background: var(--accent-soft); }
  .nav-sub { padding-left: 8px; }

  /* ---------- Main ---------- */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    padding: 16px 28px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; background: var(--panel);
  }
  .topbar h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -.4px; color: var(--forest); }
  .topbar .sub { color: var(--ink-faint); font-size: 12.5px; margin-top: 1px; }
  .topbar .spacer { flex: 1; }

  /* Signature element: the Wise pill toggle. Active side is the iconic
     bright-green fill with forest-green text. */
  .mode-toggle {
    display: inline-flex; background: #eef1ec;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px;
  }
  .mode-toggle button {
    border: none; background: none; border-radius: 999px; padding: 9px 20px;
    font-size: 14.5px; font-weight: 700; color: var(--ink-soft);
    display: flex; align-items: center; gap: 8px; letter-spacing: -.1px;
    transition: background .15s, color .15s;
  }
  .mode-toggle button .ic { font-size: 15px; }
  .mode-toggle button:hover { color: var(--forest); }
  .mode-toggle button.active { background: var(--accent); color: var(--forest); box-shadow: 0 1px 2px rgba(22,51,0,.14); }
  .mode-toggle button.active:hover { color: var(--forest); }
  .mode-div { width: 1px; height: 34px; background: var(--line); margin: 0 6px; }

  .toolbar {
    padding: 12px 28px; display: flex; gap: 10px; align-items: center;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .quickadd {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line-strong);
    border-radius: 12px; padding: 9px 13px;
  }
  .quickadd:focus-within { border-color: var(--forest); background: #fff; box-shadow: var(--ring); }
  .quickadd input { flex: 1; border: none; background: none; outline: none; font-size: 14px; }
  .quickadd .plus { color: var(--accent-ink); font-size: 17px; font-weight: 700; }

  select.control, .btn {
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink-soft);
    border-radius: var(--radius-sm); padding: 7px 11px; font-size: 13px;
  }
  select.control:hover, .btn:hover { border-color: var(--forest); color: var(--forest); }
  .btn.ghost { border-color: transparent; }

  /* ---------- Notes import banner ---------- */
  .imp-banner {
    margin: 12px 28px 0; padding: 14px 16px;
    background: var(--accent-soft); border: 1px solid var(--accent);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .imp-head { font-weight: 700; color: var(--forest); font-size: 14px; }
  .imp-list { margin: 8px 0 12px; display: flex; flex-direction: column; gap: 3px; }
  .imp-item { font-size: 13px; color: var(--ink); }
  .imp-item .imp-src { color: var(--ink-faint); font-size: 12px; }
  .imp-item.imp-more { color: var(--ink-faint); font-style: italic; }
  .imp-actions { display: flex; gap: 10px; align-items: center; }

  /* ---------- Cross-project attribute filter bar ---------- */
  .filterbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:10px 28px; border-bottom:1px solid var(--line); background:var(--panel); }
  .fb-label { font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint); font-weight:600; margin-right:2px; }
  .fb-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong);
    background:var(--panel); color:var(--ink-soft); border-radius:999px; padding:6px 12px;
    font-size:13px; font-weight:500; }
  .fb-chip:hover { border-color:var(--forest); color:var(--forest); }
  .fb-chip.on { background:var(--accent-soft); border-color:var(--accent); color:var(--forest); font-weight:600; }
  .fb-chip .fb-ic { font-size:12px; }
  .fb-clear { border:none; background:none; color:var(--ink-faint); font-size:13px;
    padding:6px 8px; margin-left:auto; border-radius:8px; }
  .fb-clear:hover { color:var(--red); background:#fdeceb; }

  .list-wrap { flex: 1; overflow-y: auto; padding: 8px 28px 60px; }

  .group-head {
    font-size: 12px; font-weight: 650; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: .05em;
    padding: 20px 4px 8px; display: flex; align-items: center; gap: 8px;
  }
  .group-head .g-count { color: var(--ink-faint); font-weight: 500; }
  .group-sep { height: 1px; background: var(--line); margin: 6px 4px 0; }

  /* ---------- Todo card ---------- */
  .todo {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px;
    cursor: pointer; transition: border-color .12s, box-shadow .12s;
  }
  .todo:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .todo.done { opacity: .55; }
  .todo.done .t-title { text-decoration: line-through; color: var(--ink-faint); }

  .check {
    width: 20px; height: 20px; border-radius: 50%; border: 1.8px solid var(--line-strong);
    flex: none; margin-top: 1px; background: none; display: flex; align-items: center; justify-content: center;
    color: var(--forest); font-size: 12px; font-weight: 700; transition: background .12s, border-color .12s;
  }
  .check:hover { border-color: var(--forest); }
  .todo.done .check { background: var(--accent); border-color: var(--accent); color: var(--forest); }

  .t-body { flex: 1; min-width: 0; }
  .t-title { font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .t-star { font-size: 13px; color: #c48f00; }
  .t-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; padding: 2px 8px; border-radius: 20px;
    background: #f1f1ee; color: var(--ink-soft); font-weight: 500; white-space: nowrap;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip.due-over { background: #fdeceb; color: var(--red); }
  .chip.due-soon { background: #fbf1d3; color: var(--amber); }
  .chip.prio-3 { background: #fdeceb; color: var(--red); }
  .chip.prio-2 { background: #fbf1d3; color: var(--amber); }
  .chip.prio-1 { background: #eaf6df; color: var(--green); }
  .chip.est { background: var(--accent-soft); color: var(--accent-ink); }
  .chip.qw { background: #dbf6c6; color: #2c6414; font-weight: 600; }
  .chip.lt { background: #e6f5e9; color: #2f7d4a; font-weight: 600; }

  /* Chips you can click to edit right on the card */
  .chip.editable { cursor: pointer; transition: filter .12s, border-color .12s, color .12s, background .12s; }
  .chip.editable:hover { filter: brightness(.95); }
  /* Location chip = a different level (where the task lives), so it looks distinct */
  .chip.loc {
    background: var(--panel); border: 1px solid var(--line-strong);
    color: var(--ink); font-weight: 600;
  }
  .chip.loc.editable:hover { filter: none; border-color: var(--forest); color: var(--forest); }
  /* Faint "add this attribute" placeholder chips */
  .chip.add {
    background: none; border: 1px dashed var(--line-strong); color: var(--ink-faint); font-weight: 500;
  }
  .chip.add.editable:hover { filter: none; border-color: var(--forest); color: var(--forest); }
  /* Thin divider that sets the location chip apart from the attribute chips */
  .chip-sep { width: 1px; align-self: stretch; background: var(--line); margin: 1px 3px; }

  /* ---------- Inline edit popover ---------- */
  .pop {
    position: fixed; z-index: 60; background: var(--panel);
    border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow);
    padding: 8px; min-width: 190px; max-width: 280px;
    display: none; flex-direction: column; gap: 6px;
  }
  .pop.open { display: flex; }
  .pop-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); font-weight: 700; padding: 2px 2px 0; }
  .pop-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pop .opt {
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink-soft);
    border-radius: 7px; padding: 6px 9px; font-size: 13px; text-align: left; flex: 1 1 auto;
  }
  .pop .opt:hover { border-color: var(--forest); color: var(--forest); }
  .pop .opt.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--forest); font-weight: 600; }
  .pop .opt .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .pop input[type=date], .pop input[type=number] {
    border: 1px solid var(--line-strong); border-radius: 7px; padding: 6px 8px; width: 100%; outline: none;
  }
  .pop input:focus { border-color: var(--forest); box-shadow: var(--ring); }
  .pop .opt.pop-clear { color: var(--red); border-color: transparent; text-align: center; }
  .pop .opt.pop-clear:hover { border-color: var(--red); background: #fdeceb; }

  .subbar { margin-top: 8px; display: flex; align-items: center; gap: 9px; }
  .subbar .track { flex: 1; max-width: 180px; height: 6px; background: #e6ebe0; border-radius: 5px; overflow: hidden; }
  .subbar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .subbar .frac { font-size: 11.5px; color: var(--ink-faint); }

  /* ---------- Group cluster ---------- */
  .group-cluster {
    border: 1px solid var(--line); border-left: 3px solid var(--line-strong);
    border-radius: var(--radius); background: #f4f5f2;
    padding: 8px 8px 4px; margin-bottom: 12px;
  }
  .group-cluster.done-all { border-left-color: var(--line-strong); background: #f3f5f0; }
  .group-head-card {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 8px 10px; cursor: pointer;
  }
  .group-head-card .g-name {
    font-weight: 700; color: var(--forest); font-size: 14.5px;
    display: flex; align-items: center; gap: 6px;
  }
  .group-cluster.done-all .g-name { color: var(--ink-faint); text-decoration: line-through; }
  .group-head-card:hover .g-name { text-decoration: underline; }
  .group-head-card .subbar { margin-top: 0; margin-left: auto; }
  .group-cluster .todo { background: var(--panel); }
  .group-empty { padding: 2px 10px 8px; color: var(--ink-faint); font-size: 12.5px; }
  .chip.group-tag { background: #eef0ec; color: var(--ink-soft); font-weight: 600; }

  .empty { text-align: center; color: var(--ink-faint); padding: 70px 20px; }
  .empty .big { font-size: 34px; margin-bottom: 10px; }

  /* ---------- Detail drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(20,22,26,.28); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 40; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100vh; height: 100dvh; width: 400px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--line);
    box-shadow: -10px 0 40px rgba(0,0,0,.12); z-index: 50;
    transform: translateX(100%); transition: transform .2s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .drawer-head .btn { padding: 5px 9px; }
  .drawer-body { padding: 18px 20px; overflow-y: auto; flex: 1; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .field input[type=text], .field textarea, .field select, .field input[type=date], .field input[type=number] {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; background: var(--panel); outline: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--forest); box-shadow: var(--ring); }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 7px; font-size: 13px; color: var(--ink-soft); }
  .seg button.on-1 { background: #eaf6df; border-color: var(--green); color: var(--green); font-weight: 600; }
  .seg button.on-2 { background: #fbf1d3; border-color: var(--amber); color: var(--amber); font-weight: 600; }
  .seg button.on-3 { background: #fdeceb; border-color: var(--red); color: var(--red); font-weight: 600; }

  .sub-list { margin-top: 4px; }
  .sub-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .sub-item .schk { width: 16px; height: 16px; border-radius: 4px; border: 1.6px solid var(--line-strong); flex: none; background: none; color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .sub-item.done .schk { background: var(--green); border-color: var(--green); }
  .sub-item.done .stxt { text-decoration: line-through; color: var(--ink-faint); }
  .sub-item .stxt { flex: 1; border: none; background: none; outline: none; padding: 2px; }
  .sub-item .sdel { border: none; background: none; color: var(--ink-faint); font-size: 15px; padding: 0 4px; }
  .sub-item .sdel:hover { color: var(--red); background: #fdeceb; border-radius: 5px; }
  .sub-item .gopen { border: none; background: none; color: var(--ink-faint); font-size: 15px; padding: 0 4px; flex: none; }
  .sub-item .gopen:hover { color: var(--forest); background: var(--accent-soft); border-radius: 5px; }
  .sub-item .stxt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub-add { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .sub-add input { flex: 1; border: none; border-bottom: 1px dashed var(--line-strong); background: none; outline: none; padding: 4px 2px; }

  .drawer-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .btn.danger { color: var(--red); border-color: transparent; }
  .btn.danger:hover { border-color: var(--red); background: #fdeceb; }
  .btn.primary { background: var(--accent); color: var(--forest); border-color: var(--accent); font-weight: 700; border-radius: 999px; padding: 8px 18px; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--forest); }

  input[type=color] { display: none; }
  .hidden { display: none !important; }

  /* ---------- Mobile navigation: view-chip strip + ⋯ bottom sheet ---------- */
  /* All hidden on desktop (the sidebar is the desktop nav); revealed under the 720px
     breakpoint below. The sidebar stays the single source that renderNav() renders into
     alongside these, so desktop + mobile navigation never drift apart. */
  .nav-toggle {
    display: none; border: 1px solid var(--line-strong); background: var(--panel);
    color: var(--ink-soft); border-radius: var(--radius-sm); padding: 6px 12px;
    font-size: 18px; line-height: 1; align-items: center; flex: none;
  }
  .nav-toggle:hover { border-color: var(--forest); color: var(--forest); }

  .view-chips {
    display: none; gap: 8px; padding: 10px 16px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .view-chip {
    display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap;
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink-soft);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500;
  }
  .view-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--forest); font-weight: 600; }
  .view-chip .ico { font-size: 13px; }
  .view-chip .count { font-size: 11.5px; color: var(--ink-faint); font-weight: 500; }
  .view-chip.active .count { color: var(--forest); }

  .nav-sheet {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
    box-shadow: 0 -10px 40px rgba(22,51,0,.15); transform: translateY(100%);
    transition: transform .2s ease; max-height: 82vh; flex-direction: column;
  }
  .nav-sheet.open { transform: translateY(0); }
  .nav-sheet-handle { width: 40px; height: 4px; border-radius: 3px; background: var(--line-strong); margin: 10px auto 6px; flex: none; }
  .nav-sheet-body { overflow-y: auto; padding: 4px 14px 20px; }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .nav-toggle { display: inline-flex; }
    .view-chips { display: flex; }
    .nav-sheet { display: flex; }
    /* The ⋮ is the only way to manage areas on touch — keep it always visible + easy to hit. */
    .nav-item .row-menu { opacity: 1; padding: 8px 10px; font-size: 18px; }

    /* Reclaim the generous desktop side padding so cards + controls aren't cramped at ~390px. */
    .topbar, .toolbar, .filterbar, .list-wrap { padding-left: 16px; padding-right: 16px; }
    .imp-banner { margin-left: 16px; margin-right: 16px; }

    /* Toolbar wraps: quick-add takes the whole first line; Sort / Arrange / New set wrap beneath. */
    .toolbar { flex-wrap: wrap; }
    .quickadd { flex: 1 0 100%; }

    /* Comfortable tap targets (~44px) — grow padding, not font, where the visual must stay small. */
    .todo { padding: 14px; gap: 14px; }
    .check { width: 26px; height: 26px; }
    .t-meta .chip { padding: 6px 11px; }
    .nav-item { padding: 10px 8px; }
    select.control, .btn { padding: 10px 13px; }
    .fb-chip { padding: 9px 14px; }

    /* iOS auto-zooms the page when a focused input renders < 16px — pin form inputs to 16px. */
    .quickadd input,
    .pop input[type=date], .pop input[type=number],
    .field input[type=text], .field textarea, .field select,
    .field input[type=date], .field input[type=number] { font-size: 16px; }

    /* Detail drawer fills the phone screen; its foot buttons stay reachable at the bottom. */
    .drawer { width: 100%; max-width: 100%; }

    /* Keep the topbar row (mode toggle · title · ⋯) from overflowing on small phones so the ⋯
       never scrolls off-screen: compact the toggle + gap, and let a long title ellipsis-truncate. */
    .topbar { gap: 10px; }
    .topbar-title { min-width: 0; }
    .topbar h1 { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mode-toggle button { padding: 9px 14px; }
  }
</style>
</head>

     independently of the detail drawer. Populated by renderAreas/renderData. -->

    </div>
